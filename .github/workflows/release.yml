name: Build and publish Helium-5

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer and update files
        working-directory: desktop
        run: npm run dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            desktop/dist/Helium-5-Setup-*.exe `
            desktop/dist/Helium-5-Setup-*.exe.blockmap `
            desktop/dist/latest.yml `
            --title "Helium-5 ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
